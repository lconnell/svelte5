version: '3'

tasks:
  # --- Frontend Tasks ---
  dev:frontend:
    desc: "Starts the frontend development server"
    dir: frontend
    cmds:
      - bun run dev

  build:frontend:
    desc: "Builds the frontend application for production"
    dir: frontend
    cmds:
      - bun run build

  preview:frontend:
    desc: "Previews the frontend production build locally"
    dir: frontend
    cmds:
      - bun run preview

  prepare:frontend:
    desc: "Runs svelte-kit sync for the frontend"
    dir: frontend
    cmds:
      - bun run prepare

  check:frontend:
    desc: "Runs svelte-kit sync and svelte-check for the frontend"
    dir: frontend
    cmds:
      - bun run check

  check:watch:frontend:
    desc: "Runs svelte-kit sync and svelte-check in watch mode for the frontend"
    dir: frontend
    cmds:
      - bun run check:watch

  postcss:build:frontend:
    desc: "Builds frontend CSS using PostCSS"
    dir: frontend
    cmds:
      - bun run postcss:build

  openapi:fetch:frontend:
    desc: "Fetches the OpenAPI schema for the frontend"
    dir: frontend
    cmds:
      - bun run openapi:fetch

  openapi:generate:frontend:
    desc: "Generates API client for the frontend"
    dir: frontend
    cmds:
      - bun run openapi:generate

  # --- Backend Tasks ---
  dev:backend:
    desc: "Starts the backend development server"
    dir: backend
    cmds:
      - bun run dev # Assumes backend/package.json has a "dev" script

  # --- Docker Tasks ---
  docker:build:frontend:
    desc: "Builds the frontend Docker image as 'workorder-frontend:latest'"
    cmds:
      - docker build -t workorder-frontend:latest -f frontend/Dockerfile ./frontend

  docker:run:frontend:
    desc: "Runs the frontend Docker container 'workorder-frontend:latest' on port 8080"
    cmds:
      - docker run -d -p 8080:80 --name workorder-frontend workorder-frontend:latest

  docker:stop:frontend:
    desc: "Stops and removes the frontend Docker container named 'workorder-frontend'"
    cmds:
      - docker stop workorder-frontend
      - docker rm workorder-frontend
    ignore_error: true

  docker:build:backend:
    desc: "Builds the backend Docker image as 'workorder-backend:latest'"
    cmds:
      - docker build -t workorder-backend:latest -f backend/Dockerfile ./backend

  docker:run:backend:
    desc: "Runs the backend Docker container 'workorder-backend:latest' on port 3000"
    cmds:
      - docker run -d -p 3000:3000 --name workorder-backend workorder-backend:latest

  docker:stop:backend:
    desc: "Stops and removes the backend Docker container named 'workorder-backend'"
    cmds:
      - docker stop workorder-backend
      - docker rm workorder-backend
    ignore_error: true

  # --- Root Quality & Utility Tasks ---
  lint:
    desc: "Lints the entire codebase using Biome (from project root)"
    cmds:
      - bunx biome check . # Uses Biome, respecting root biome.json

  format:
    desc: "Formats the entire codebase using Biome (from project root)"
    cmds:
      - bunx biome check --write --unsafe . # Uses Biome, respecting root biome.json

  # Default task: lists all available tasks
  default:
    desc: "Lists all available tasks"
    cmds:
      - task --list-all
    silent: true
